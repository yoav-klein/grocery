<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gupter:wght@700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: Poppins, 'Segoe UI', sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
        }

        body > header {
            height: 200px;
            background-color: aqua;
        }

        main {
            background-color: rgb(255, 255, 120);
            height: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .content {
            border: 1px solid black;
            width: clamp(min(500px, calc(100vw - 32px)), 40vw, 600px);
            height: 400px;
            padding: 0.5rem;

        }

        main header {
            display: flex;
            flex-direction: row;

            h1 {
                line-height: 3rem;
            }
            
            justify-content: space-between;
        }

        .insert-button {
            background-color: #86EFAC;
            border: none;
            border-radius: 10px;
            height: 3rem;
            width: 9rem;
        }

        
    </style>
</head>
<body>
    <header>
        This is header
    </header>
    <main>
        <div class="content">
            <header>
                <div class="title">
                    <h1>Title</h1>
                    <p>1 items</p>
                </div>
                <div class="actions">
                    <button class="insert-button">Insert</button>
                    
                </div>
            </header>
        </div>
    </main>
</body>
</html>
