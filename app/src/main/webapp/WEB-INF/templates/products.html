<!DOCTYPE html>
<html th:replace="~{layout-tenant :: layout(~{::link},~{},~{::main},~{::script})}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link th:remove="all" rel="stylesheet" href="../../css/base.css" th:href="@{/css/base.css}">
        <link th:remove="all" rel="stylesheet" href="../../css/offline.css">
        <link th:remove="all" rel="stylesheet" href="../../css/popovers.css">
        <link th:remove="all" rel="stylesheet" href="../../css/dialogs.css" th:href="@{/css/dialogs.css}">
        <link rel="stylesheet" href="../../css/categories.css" th:href="@{/css/categories.css}">
        <link rel="stylesheet" href="../../css/products.css" th:href="@{/css/products.css}">
    </head>
    <body>
        <div class="wrapper" th:remove="tag">

            <main>
                <div class="categories-scroll-container">
                    <section class="category-grid">
                        <article class="category" th:each="category : ${productsByCategory}">
                            <h2 th:text="#{${'category.title.' + category.key}}">VEGETABLES</h2>
                            <ul>
                                <li th:each="product : ${category.value}">
                                    <p class="item-name" th:text="${product.name}">Tomato</p>
                                    <p class="item-quantity-type" th:text="${product.quantityType}">Kg</p>
                                    <div class="ui-popover product-popover">
                                        <button class="ui-popover-trigger"> 
                                            <i class="fa-solid fa-ellipsis-vertical"></i>
                                        </button>
                                        <div class="ui-popover-menu">
                                            <form method="post" th:action="@{/tenant/{tenantId}/products(tenantId=${tenant.id})}">
                                                <input type="hidden" name="_method" value="delete">
                                                <button class="menu-item delete-button" name="id" th:value="${product.productId}">
                                                    <i class="fa-regular fa-trash-can"></i>
                                                    <span>Delete</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </li>
                                <li th:remove="all">
                                    <p class="item-name">Cucmber</p>
                                    <p class="item-quantity-type">Kg</p>
                                    <div class="ui-popover product-popover">
                                        <button class="ui-popover-trigger"> 
                                            <i class="fa-solid fa-ellipsis-vertical"></i>
                                        </button>
                                        <div class="ui-popover-menu">
                                            <form method="post">
                                                <input type="hidden" name="_method" value="delete">
        
                                                <button class="menu-item delete-button" name="id">
                                                    <i class="fa-regular fa-trash-can"></i>
                                                    <span>Delete</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </article>
                    </section>
                </div>
                <button class="primary-fab" data-open-dialog data-dialog-id="add-product-dialog">+</button>
                
                <dialog id="add-product-dialog" class="ui-form-dialog">
                    <header>
                        <div class="just-for-alignment"></div>
                        <h2>New Product</h2>
                        <button data-close-dialog class="ui-dialog-close-button">&times;</button>
                    </header>
                    <form id="new-product-form">
                        <div class="ui-dialog-error-banner">
                            <p>Oops, seems that something's wrong on our end</p>
                        </div>
                        <div class="ui-dialog-body">
                            <div class="ui-dialog-field">
                                <label for="name">Name</label>
                                <input name="name" class="long-input" type="text" />
                                <p class="ui-dialog-field-validation-error"></p>
                            </div>
                            <div class="ui-dialog-field">
                                <label for="category" th:text="#{additem.label.category}">Category</label>
                                <select name="category" class="long-input">
                                    <option th:each="category : ${allCategories}" th:value="${category}" th:text="${category}">Vegetables</option>
                                    <option th:remove="all">Fruits</option>
                                    <option th:remove="all">Dairy</option>
                                </select>
                                <p class="ui-dialog-field-validation-error"></p>
                            </div>
                            <div class="ui-dialog-field">
                                <label for="quantity">Quantity Type</label>
                                <select name="quantityType">
                                    <option th:each="type : ${allQuantityTypes}" th:value="${type}" th:text="${type}">Kg</option>
                                    <option th:remove="all">Unit</option>
                                </select>
                                <p class="ui-dialog-field-validation-error"></p>
                            </div>
                            
                        </div>
                        <div class="ui-dialog-footer">
                            <div class="ui-dialog-footer-controls">
                                <button type="reset" data-close-dialog class="ui-dialog-action-button ui-dialog-secondary-action-button" name="cancel">Cancel</button>
                                <button id="dialog-submit-button" type="submit" name="save" class="ui-dialog-action-button ui-dialog-primary-action-button">Submit</button>
                            </div>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
        <script th:remove="all" src="../../js/dialogs.js" th:src="@{/js/dialogs.js}"></script>
        <script th:remove="all" src="../../js/popovers.js" th:src="@{/js/popovers.js}"></script>
        <script th:remove="all" src="https://kit.fontawesome.com/68d2baaa06.js" crossorigin="anonymous"></script>
        <script type="module" src="../../js/products.js" th:src="@{/js/products.js}"></script>
    </body>
</html>
