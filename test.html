<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
        }

        header {
            height: 200px;
            background-color: aqua;
        }

        main {
            background-color: rgb(255, 255, 120);
            height: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .content {
            border: 1px solid black;
            width: 400px;
            height: 400px;
            padding: 0.5rem;

        }

        ul {
            list-style-type: none;
        }

        .list {
            display: grid;
            /* align-items: center; */
            align-items: start;
            gap: 10px;
            grid-template-columns: max-content max-content 100px max-content;
            /* grid-auto-rows: minmax(100px, auto); */
            column-gap: 2rem;
            
            li {
                display: grid;
                grid-template-columns: subgrid;
                grid-column: 1 / -1;

                &:hover {
                    background-color: antiquewhite;
                }

                p {
                    line-height: 5rem;
                    
                }

            }
        }

        p {
            
            
        }

        
        .checkbox-container {
            /* in order to align the checkbox and text in the same height, display flex*/
            /* display: flex;
            align-items: start; */
        }

        .checkbox-container label {
            /* so that we'll see the label clickable */
            cursor: pointer;

            /* in order for the label::before width will be respected, the display must not be inline (which is the default) */
            display: inline-flex;
        }

        .checkbox-container input[type="checkbox"] {
            /* we want the default checkbox icon  to disappear and create our own */
            appearance: none;
        }

        /* this will create our own checkbox icon */
        .checkbox-container label::before {
            content: '';
            /* 1em will make it the same size as our font-size */
            width: .9rem;
            height: .9rem;
            border: 0.05em solid black;
            border-radius: 2px;
            /* margin-right: .5rem; */
        }
                
        

        
    </style>
</head>
<body>
    <header>
        This is header
    </header>
    <main>
        <div class="content">
            <ul class="list">
                <li>
                    <p>122</p>
                    <p>
                        <input class="delete-checkbox" type="checkbox">
                        <label></label>
                    </p>
                    <p>Tomato bambino</p>
                    <p class="checkbox-container">
                        <input class="delete-checkbox" type="checkbox">
                        <label></label>
                    </p>
                </li>
                <li>
                    <p>1</p>
                    <p>UNIT</p>
                    <p>Tomato</p>
                    <p class="checkbox-container">
                        <input class="delete-checkbox" type="checkbox">
                        <label></label>
                    </p>
                </li>
                <li>
                    <p>1</p>
                    <p>Kg</p>
                    <p>Tomato</p>
                    <p class="checkbox-container">
                        <input class="delete-checkbox" type="checkbox">
                        <label></label>
                    </p>
                </li>
                <li>
                    <p>1</p>
                    <p>Kg</p>
                    <p>Tomato</p>
                    <p class="checkbox-container">
                        <input class="delete-checkbox" type="checkbox">
                        <label></label>
                    </p>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
